<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#081629"><meta name="description" content="A private, password-encrypted personal finance tracker."><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"><title>Glass Ledger · Personal finance</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head>
<body><div class="ambient" aria-hidden="true"></div><main id="root"></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="transaction-dialog"><form id="transaction-form"><div class="dialog-head"><h2 id="transaction-title">Add transaction</h2><button type="button" class="icon-button" data-close aria-label="Close">×</button></div><input type="hidden" name="id"><label>Type<select name="type"><option value="expense">Expense</option><option value="income">Income</option></select></label><label>Description<input name="description" maxlength="100" required placeholder="What was it for?"></label><div class="form-grid"><label>Amount<input name="amount" type="number" min="0.01" max="999999999" step="0.01" required inputmode="decimal"></label><label>Date<input name="date" type="date" required></label></div><label>Category<select name="category" id="category-select"></select></label><label>Note <span class="muted">(optional)</span><input name="note" maxlength="300" placeholder="Add a little context"></label><p class="form-error" id="transaction-error" role="alert"></p><button class="primary" type="submit">Save transaction</button></form></dialog>
<dialog id="budget-dialog"><form id="budget-form"><div class="dialog-head"><h2>Monthly budgets</h2><button type="button" class="icon-button" data-close aria-label="Close">×</button></div><p class="muted">Set a monthly limit per category. These limits apply to every month.</p><div id="budget-inputs"></div><p class="form-error" id="budget-error" role="alert"></p><button class="primary" type="submit">Save budgets</button></form></dialog>
<dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">Delete transaction?</h2><p id="confirm-text">This action cannot be undone.</p><div class="actions"><button value="cancel">Cancel</button><button value="yes" class="danger">Delete</button></div></form></dialog>
<input id="backup-file" type="file" accept=".json,application/json" hidden><script type="module" src="app.js"></script></body></html>
